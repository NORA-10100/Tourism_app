<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:attr="lang=${currentLanguage}">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{currency.title} + ' | Vita'">為替レート | Vita</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <header th:replace="~{fragments/common :: header(#{currency.title})}"></header>
  <main class="page-content">
    <!-- メモ: レートの取得元を表示し、利用者が参考値・保存値・最新値を区別できるようにします。 -->
    <h1 th:text="#{currency.heading}">リアルタイム為替レート</h1>
    <p class="notice" th:if="${snapshot.live}"
       th:text="#{currency.live(${snapshot.updatedAtLabel})}">最新のレートを取得しました。</p>
    <p class="notice" th:if="${snapshot.cached}" th:text="#{currency.cached}">保存済みのレートを表示しています。</p>
    <p class="notice" th:if="${snapshot.fallback}" th:text="#{currency.fallback}">参考レートを表示しています。</p>
    <p class="sample-note" th:if="${snapshot.updatedAtLabel != null}"
       th:text="#{currency.updated(${snapshot.updatedAtLabel})}">更新日時</p>
    <section class="rate-list" aria-label="為替レート">
      <article class="rate-row" th:each="rate : ${snapshot.rates}">
        <span class="rate-flag" aria-hidden="true" th:text="${rate.flag}">💱</span>
        <div>
          <strong th:text="|${rate.code} · ${rate.name}|">USD · 米ドル</strong>
          <small th:text="|1 ${rate.code} = ${#numbers.formatDecimal(rate.rate, 1, 'COMMA', 2, 'POINT')} JPY|">1 USD = 149.32 JPY</small>
        </div>
      </article>
    </section>
    <!-- メモ: 換算結果は送信された金額と選択通貨からサーバー側で計算します。 -->
    <section class="convert-panel">
      <h2 th:text="#{currency.convert.title}">外貨を円に換算する</h2>
      <form th:action="@{/currency/convert}" method="post">
        <label class="form-field">
          <span th:text="#{currency.amount}">金額</span>
          <input type="number" name="amount" min="0" step="0.01"
                 th:value="${inputAmount != null ? inputAmount : 100}" required>
        </label>
        <label class="form-field">
          <span th:text="#{currency.currency}">通貨</span>
          <select name="currency" required>
            <option th:each="rate : ${snapshot.rates}" th:value="${rate.code}"
                    th:text="|${rate.code} · ${rate.name}|"
                    th:selected="${selectedCurrency == rate.code}">USD</option>
          </select>
        </label>
        <button class="primary-action" type="submit" th:text="#{currency.convert}">日本円に換算する</button>
      </form>
      <p class="field-error" role="alert" th:if="${error}" th:text="${error}"></p>
      <p class="conversion-result" th:if="${convertedAmount != null}">
        <span th:text="|${inputAmount} ${selectedCurrency}|">100 USD</span>
        <b th:text="|= ${#numbers.formatDecimal(convertedAmount, 1, 'COMMA', 0, 'POINT')} JPY|">= 14,932 JPY</b>
      </p>
    </section>
    <p class="sample-note" th:text="#{currency.note}">レートは10分ごとに更新されます。</p>
    <a class="secondary-action" th:href="@{/receipts/scan}" th:text="#{currency.record}">家計簿に記録する</a>
  </main>
  <footer th:replace="~{fragments/common :: footer}"></footer>
  <nav th:replace="~{fragments/common :: nav('currency')}"></nav>
</div>
</body>
</html>
