<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>レシート撮影 | Vita</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell">
  <header th:replace="~{fragments/common :: header('家計簿')}"></header>
  <main class="page-content capture-page">
    <h1>レシートを記録</h1>
    <p class="notice">レシートを撮影するか、ギャラリーから画像を選んでください。</p>
    <p class="auth-message error" th:if="${receiptError}" th:text="${receiptError}"></p>
    <form class="capture-panel" th:action="@{/expenses/capture}" method="post" enctype="multipart/form-data">
      <label class="camera-button" for="receipt"><span aria-hidden="true">▣</span><strong>レシートを撮影する</strong><small>カメラが使えない場合は画像を選択できます</small></label>
      <input class="file-input" id="receipt" name="receipt" type="file" accept="image/*" capture="environment" required>
      <p class="file-name" id="fileName">画像が選択されていません</p>
      <button class="primary-action" type="submit">画像を確認して次へ</button>
    </form>
    <p class="notice">※ 現在は画像を受け付けた後、支出内容を手入力します。OCR読み取りは準備中です。</p>
    <a class="secondary-action" th:href="@{/expenses}">支出一覧を見る</a>
  </main>
  <nav th:replace="~{fragments/common :: nav('expenses')}"></nav>
</div>
<script>
  const receiptInput = document.getElementById('receipt');
  receiptInput.addEventListener('change', () => {
    document.getElementById('fileName').textContent = receiptInput.files.length
      ? receiptInput.files[0].name : '画像が選択されていません';
  });
</script>
</body></html>
