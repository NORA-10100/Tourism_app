<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>支出グラフ | Vita</title><link rel="stylesheet" th:href="@{/css/app.css}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body><div class="app-shell">
  <header th:replace="~{fragments/common :: header('支出グラフ')}"></header>
  <main class="page-content">
    <h1>支出グラフ</h1>
    <section class="summary-card"><span>合計金額</span><strong><span th:text="${#numbers.formatDecimal(totalAmount, 1, 'COMMA', 0, 'POINT')}">0</span> 円</strong></section>
    <div class="chart-tabs"><button type="button" class="chart-tab is-selected" id="dailyTab">日別</button><button type="button" class="chart-tab" id="categoryTab">カテゴリ別</button></div>
    <section class="chart-panel" id="dailyPanel"><h2>日別の支出</h2><canvas id="dailyChart" aria-label="日別支出グラフ"></canvas></section>
    <section class="chart-panel" id="categoryPanel" hidden><h2>カテゴリ別の支出</h2><canvas id="categoryChart" aria-label="カテゴリ別支出グラフ"></canvas></section>
    <a class="primary-action" th:href="@{/expenses/new}">＋ 支出を入力する</a>
    <a class="secondary-action" th:href="@{/expenses}">支出一覧へ</a>
  </main>
  <nav th:replace="~{fragments/common :: nav('expenses')}"></nav>
</div>
<script th:inline="javascript">
  const labelsByDay = [[${dailyLabels}]];
  const totalsByDay = [[${dailyValues}]];
  const labelsByCategory = [[${categoryLabels}]];
  const totalsByCategory = [[${categoryValues}]];
  const dailyPanel = document.getElementById('dailyPanel');
  const categoryPanel = document.getElementById('categoryPanel');
  const dailyTab = document.getElementById('dailyTab');
  const categoryTab = document.getElementById('categoryTab');
  dailyTab.addEventListener('click', () => {
    dailyPanel.hidden = false; categoryPanel.hidden = true;
    dailyTab.classList.add('is-selected'); categoryTab.classList.remove('is-selected');
  });
  categoryTab.addEventListener('click', () => {
    dailyPanel.hidden = true; categoryPanel.hidden = false;
    categoryTab.classList.add('is-selected'); dailyTab.classList.remove('is-selected');
  });
  new Chart(document.getElementById('dailyChart'), {
    type: 'bar', data: { labels: labelsByDay, datasets: [{ label: '支出（円）', data: totalsByDay, backgroundColor: '#ff7900' }] },
    options: { responsive: true, scales: { y: { beginAtZero: true } } }
  });
  new Chart(document.getElementById('categoryChart'), {
    type: 'pie', data: { labels: labelsByCategory, datasets: [{ label: '支出（円）', data: totalsByCategory, backgroundColor: ['#ff7900', '#ffb36b', '#f39b75', '#f5cd73', '#e65b34'] }] },
    options: { responsive: true }
  });
</script>
</body></html>
