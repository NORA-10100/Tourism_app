<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>支出一覧 | Vita</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body><div class="app-shell">
  <header th:replace="~{fragments/common :: header('家計簿')}"></header>
  <main class="page-content">
    <h1>支出一覧</h1>
    <a class="primary-action" th:href="@{/expenses/new}">＋ 支出を入力する</a>
    <p class="empty-state" th:if="${#lists.isEmpty(expenses)}">支出はまだありません。最初の支出を入力してください。</p>
    <section class="expense-list" aria-label="支出">
      <article class="expense-card" th:each="expense : ${expenses}">
        <div class="expense-card-top"><time th:text="${expense.expenseDate}">2026-10-30</time><strong><span th:text="${#numbers.formatDecimal(expense.amountJpy, 1, 'COMMA', 0, 'POINT')}">0</span> 円</strong></div>
        <h2 th:text="${expense.itemName}">品目名</h2>
        <span class="category-badge" th:text="${expense.category}">カテゴリ</span>
        <a class="text-action" th:href="@{/expenses/{id}/edit(id=${expense.id})}">内容を確認・編集</a>
      </article>
    </section>
    <a class="secondary-action" th:href="@{/expenses/graph}">支出グラフを見る</a>
  </main>
  <nav th:replace="~{fragments/common :: nav('expenses')}"></nav>
</div></body>
</html>
