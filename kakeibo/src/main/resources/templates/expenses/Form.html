<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>支出の確認・編集 | Vita</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body><div class="app-shell">
  <header th:replace="~{fragments/common :: header('支出の確認・編集')}"></header>
  <main class="page-content">
    <h1 th:text="${expense.id == null ? '支出を入力' : '支出を確認・編集'}">支出を入力</h1>
    <p class="notice" th:if="${receiptMessage}" th:text="${receiptMessage}"></p>
    <p class="auth-message error" th:if="${receiptError}" th:text="${receiptError}"></p>
    <p class="notice">内容を入力して「保存」を押してください。保存後、支出グラフを表示します。</p>
    <form class="form-panel" th:action="@{/expenses}" th:object="${expense}" method="post">
      <input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{userId}">
      <label class="form-field">支出日<input type="date" th:field="*{expenseDate}" required><span class="field-error" th:if="${#fields.hasErrors('expenseDate')}" th:errors="*{expenseDate}"></span></label>
      <label class="form-field">品目名<input type="text" maxlength="50" th:field="*{itemName}" required><span class="field-error" th:if="${#fields.hasErrors('itemName')}" th:errors="*{itemName}"></span></label>
      <label class="form-field">金額（円）<input type="number" min="0.01" step="0.01" th:field="*{amountJpy}" required><span class="field-error" th:if="${#fields.hasErrors('amountJpy')}" th:errors="*{amountJpy}"></span></label>
      <label class="form-field">カテゴリ<select th:field="*{category}" required><option value="" disabled>選択してください</option><option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option></select></label>
      <details class="optional-fields"><summary>外貨情報（任意）</summary>
        <label class="form-field">通貨コード<input type="text" maxlength="3" th:field="*{originalCurrency}"></label>
        <label class="form-field">外貨の金額<input type="number" min="0" step="0.01" th:field="*{originalAmount}"></label>
      </details>
      <div class="form-actions"><button class="primary-action" type="submit">保存してグラフを見る</button><a class="secondary-action" th:href="@{/expenses}">一覧へ戻る</a></div>
    </form>
    <form th:if="${expense.id != null}" th:action="@{/expenses/{id}/delete(id=${expense.id})}" method="post">
      <button type="submit" class="delete-btn">削除</button>
    </form>
  </main>
  <nav th:replace="~{fragments/common :: nav('expenses')}"></nav>
</div></body>
</html>
