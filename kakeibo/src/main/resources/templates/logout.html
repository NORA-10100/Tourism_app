<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ログアウト確認 | Vita</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page"><main class="auth-shell">
  <p class="auth-brand">Vita</p>
  <section class="auth-panel">
    <h1>ログアウトしますか？</h1>
    <p class="auth-description">ログアウトすると、ログイン画面に戻ります。</p>
    <form th:action="@{/logout}" method="post"><button class="auth-submit" type="submit">ログアウト</button></form>
    <a class="secondary-action" th:href="@{/home}">キャンセルしてホームへ戻る</a>
  </section>
</main></body>
</html>
