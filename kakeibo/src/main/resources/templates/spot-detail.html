<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>スポット詳細 | Vita</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell">
  <header th:replace="~{fragments/common :: header('スポット詳細')}"></header>
  <main class="page-content">
    <a class="back-text" th:href="@{/features/spots}">‹ おすすめスポット</a>
    <div class="spot-photo spot-photo-cafe detail-photo"><span>沖縄のおすすめ</span></div>
    <h1 th:text="${spotName}">スポット名</h1>
    <p class="location-row" th:text="${spotArea}">エリア</p>
    <p class="detail-description" th:text="${spotDescription}">スポットの説明</p>
    <div class="detail-info"><span>営業時間</span><strong>10:00〜18:00</strong><span>アクセス</span><strong>最寄りのバス停から徒歩約5分</strong><span>口コミ評価</span><strong>★ 4.8 / 5.0</strong></div>
    <p class="sample-note">営業時間・アクセスは画面見本です。実際のスポットデータは未接続です。</p>
    <a class="primary-action" th:href="@{/features/spots}">スポット一覧へ戻る</a>
  </main>
  <nav th:replace="~{fragments/common :: nav('spots')}"></nav>
</div></body></html>
