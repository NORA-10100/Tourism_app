<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:attr="lang=${currentLanguage}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{mypage.title} + ' | Vita'">マイページ | Vita</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell">
  <header th:replace="~{fragments/common :: header(#{mypage.title})}"></header>
  <main class="page-content">
    <!-- メモ: 利用者情報はログインセッションから受け取り、各設定・履歴画面へ案内します。 -->
    <section class="profile-card"><span class="avatar">☺</span><div><h1 th:text="${username}">たび子</h1><p th:text="${userEmail}">user@example.com</p></div><span class="profile-label" th:text="#{mypage.label}">旅行を楽しむ会員</span></section>
    <nav class="settings-list" th:attr="aria-label=#{mypage.title}">
      <a th:href="@{/expenses}"><span>▣</span><span th:text="#{mypage.expenses}">家計簿データ</span><b>›</b></a>
      <a th:href="@{/currency}"><span>⇄</span><span th:text="#{mypage.currency}">為替レート</span><b>›</b></a>
      <a th:href="@{/language}"><span>◎</span><span th:text="#{mypage.language}">言語設定</span><b>›</b></a>
      <a th:href="@{/logout/confirm}"><span>↪</span><span th:text="#{mypage.logout}">ログアウト</span><b>›</b></a>
    </nav>
    <p class="sample-note" th:text="#{mypage.note}">旅の思い出も、支出も、為替も。すべてこのアプリで。</p>
  </main>
  <footer th:replace="~{fragments/common :: footer}"></footer>
  <nav th:replace="~{fragments/common :: nav('settings')}"></nav>
</div></body></html>
