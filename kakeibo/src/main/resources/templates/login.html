<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | Vita</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page"><main class="auth-shell">
  <p class="auth-brand">Vita <span aria-hidden="true">・沖縄観光支援</span></p>
  <section class="auth-panel">
    <h1>ログイン</h1>
    <p class="auth-description">アカウントにログインしてください。</p>
    <p class="auth-message error" th:if="${error}" th:text="${error}"></p>
    <p class="auth-message success" th:if="${message}" th:text="${message}"></p>
    <form th:action="@{/login}" method="post">
      <label for="email">メールアドレス<input id="email" type="email" name="email" autocomplete="username" required></label>
      <label for="password">パスワード<input id="password" type="password" name="password" autocomplete="current-password" required></label>
      <button class="auth-submit" type="submit">ログイン</button>
    </form>
    <nav class="auth-links" aria-label="ログイン関連">
      <a class="secondary-action" th:href="@{/register}">新規アカウントを作成</a>
      <p><a th:href="@{/language}">言語選択へ戻る</a></p>
    </nav>
  </section>
</main></body>
</html>
