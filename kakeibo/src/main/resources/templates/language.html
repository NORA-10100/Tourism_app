<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>言語設定 | Vita</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell">
  <header class="app-header"><a class="header-home" th:href="${loggedIn} ? @{/home} : @{/}" aria-label="前の画面へ">Vita</a><span class="header-title">言語設定</span><span class="header-placeholder"></span></header>
  <main class="page-content">
    <h1 th:text="${loggedIn} ? '言語設定' : '言語を選択'">言語設定</h1>
    <p class="notice">表示に使う言語を選んで「適用」を押してください。</p>
    <form class="form-panel language-form" th:action="@{/language}" method="post">
      <fieldset class="language-options"><legend>表示言語</legend>
        <label><input type="radio" name="language" value="ja" th:checked="${selectedLanguage == null || selectedLanguage == 'ja'}" required><span>🇯🇵</span>日本語</label>
        <label><input type="radio" name="language" value="en" th:checked="${selectedLanguage == 'en'}"><span>🇬🇧</span>English</label>
        <label><input type="radio" name="language" value="zh-CN" th:checked="${selectedLanguage == 'zh-CN'}"><span>🇨🇳</span>中文（简体字）</label>
        <label><input type="radio" name="language" value="zh-TW" th:checked="${selectedLanguage == 'zh-TW'}"><span>🇹🇼</span>中文（繁體字）</label>
        <label><input type="radio" name="language" value="ko" th:checked="${selectedLanguage == 'ko'}"><span>🇰🇷</span>한국어</label>
      </fieldset>
      <button class="primary-action" type="submit">適用</button>
      <a class="secondary-action" th:if="${loggedIn}" th:href="@{/home}">ホームへ戻る</a>
    </form>
  </main>
  <nav th:if="${loggedIn}" th:replace="~{fragments/common :: nav('settings')}"></nav>
</div></body></html>
