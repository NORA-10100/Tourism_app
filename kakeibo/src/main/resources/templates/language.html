<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>言語選択 | 家計簿</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f6f8; font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Helvetica Neue", Arial, sans-serif; }
    .container { width: 100%; max-width: 480px; padding: 16px; }
    h1 { font-size: 22px; margin-top: 0; }
    form { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #555; }
    select, input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #2b6cb0; color: #fff; border: none; border-radius: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>言語を選択してください</h1>
    <form th:action="@{/language}" method="post">
      <div class="field">
        <label>言語</label>
        <select name="language">
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="zh">中文</option>
          <option value="ko">한국어</option>
        </select>
      </div>
      <button type="submit">決定する</button>
    </form>
  </div>
</body>
</html>
