<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ログイン完了 | Vita</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell">
  <header th:replace="~{fragments/common :: header('ログイン完了')}"></header>
  <main class="page-content feature-content"><section class="success-card">
    <span class="success-icon" aria-hidden="true">✓</span>
    <h1>ログインしました</h1>
    <p><span th:text="${username}">ユーザー</span> さん、ようこそ。</p>
    <a class="primary-action" th:href="@{/home}">ホームへ進む</a>
  </section></main>
  <nav th:replace="~{fragments/common :: nav('home')}"></nav>
</div></body></html>
