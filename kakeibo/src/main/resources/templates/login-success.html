<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン成功</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f8ff;
            margin: 0;
            padding: 30px 15px;
        }
        main {
            max-width: 500px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 18px #0001;
        }
        button {
            padding: 12px 25px;
            color: white;
            background: #0077b6;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <h1>ログイン成功</h1>
    <p>
        <span th:text="${session.username}">ユーザー</span>
        さん、ログインしました。
    </p>
    <p>これは動作確認用の画面です。</p>

    <p>
        <a th:href="@{/logout/confirm}">ログアウト</a>
    </p>
</main>
</body>
</html>
