<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新規登録 | Vita</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
  <main class="auth-card">
    <span class="brand">Vita / 新規登録</span>
    <h1>旅の準備を<span class="accent">はじめよう</span></h1>
    <p class="lead">アカウントを作成すると、プランや支出を保存できます。</p>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
      <div class="field">
        <label for="username">ユーザー名</label>
        <input id="username" type="text" name="username" th:value="${username}"
               maxlength="50" placeholder="例：うちなー太郎" autocomplete="nickname" required>
      </div>
      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" type="email" name="email" th:value="${email}"
               placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">パスワード</label>
        <input id="password" type="password" name="password" minlength="8"
               placeholder="8文字以上" autocomplete="new-password" required>
        <p class="hint">半角英数字を組み合わせて8文字以上にしてください。</p>
      </div>
      <div class="field">
        <label for="passwordConfirm">パスワード（確認）</label>
        <input id="passwordConfirm" type="password" name="passwordConfirm" minlength="8"
               placeholder="もう一度入力" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary" type="submit">登録する</button>
    </form>

    <p class="auth-footer">
      すでにアカウントをお持ちの方は <a th:href="@{/login}">ログイン</a>
    </p>
  </main>
</body>
</html>
