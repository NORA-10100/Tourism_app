
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>ホーム画面</title>
    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">

    <!-- ヘッダー -->
    <header class="app-header">
        <a class="back-link"
           th:href="@{/logout/confirm}"
           aria-label="ログアウト確認へ">‹</a>

        <span class="header-title">ホーム</span>

        <a class="profile-link"
           th:href="@{/features/settings}">
            アイコン
        </a>
    </header>

    <!-- ホーム画面 -->
    <main class="home-content">

        <p class="greeting">
            <span th:text="${username}">なまえ</span> 様
        </p>

        <nav class="feature-grid">

            <a class="feature-card"
               th:href="@{/features/spots}">
                AIスポット案内
            </a>

            <a class="feature-card"
               th:href="@{/features/receipts}">
                レシート家計簿
            </a>

            <a class="feature-card"
               th:href="@{/features/languages}">
                多言語対応
            </a>

            <a class="feature-card"
               th:href="@{/features/realtime}">
                リアルタイム
            </a>

        </nav>
    </main>

    <!-- 下部メニュー -->
    <nav class="bottom-nav">
        <a class="nav-item is-active"
           th:href="@{/home}">ホーム</a>

        <a class="nav-item"
           th:href="@{/features/spots}">スポット</a>

        <a class="nav-item"
           th:href="@{/features/receipts}">家計簿</a>

        <a class="nav-item"
           th:href="@{/features/settings}">設定</a>
    </nav>

</div>
</body>
</html>
