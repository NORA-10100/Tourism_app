<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ホーム | Vita</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body><div class="app-shell">
  <header th:replace="~{fragments/common :: header('ホーム')}"></header>
  <main class="page-content">
    <p class="greeting"><span th:text="${username}">ユーザー</span> さん、こんにちは</p>
    <a class="home-search" th:href="@{/features/spots}"><span aria-hidden="true">⌕</span> 行き先・スポットを検索</a>
    <section class="home-hero">
      <div><small>沖縄の旅を、もっとあなたらしく。</small><h1>まだ知らない沖縄に<br>出会いに行こう。</h1><a class="hero-action" th:href="@{/features/spots}">おすすめを見る</a></div>
      <span class="hero-sun" aria-hidden="true">☀</span>
    </section>
    <h2 class="section-title">旅をサポートする機能</h2>
    <section class="feature-grid" aria-label="機能一覧">
      <a class="feature-card" th:href="@{/features/spots}"><span>⌖</span><strong>AIスポット提案</strong><small>地元のおすすめを探す</small></a>
      <a class="feature-card" th:href="@{/expenses/capture}"><span>▣</span><strong>家計簿</strong><small>旅の支出を記録する</small></a>
      <a class="feature-card" th:href="@{/currency}"><span>⇄</span><strong>リアルタイム為替</strong><small>外貨を日本円に換算</small></a>
      <a class="feature-card" th:href="@{/language}"><span>◎</span><strong>多言語選択</strong><small>表示言語を選ぶ</small></a>
    </section>
    <p class="notice">旅の思い出も、支出も、為替も。すべてこのアプリで。</p>
  </main>
  <nav class="bottom-nav" th:replace="~{fragments/common :: nav('home')}"></nav>
</div></body>
</html>
