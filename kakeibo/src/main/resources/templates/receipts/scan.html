<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="scan-url" th:content="@{/api/receipts/scan}">
  <meta name="csrf-token" th:content="${_csrf != null ? _csrf.token : ''}">
  <meta name="csrf-header" th:content="${_csrf != null ? _csrf.headerName : ''}">
  <title>レシート読み取り | Vita</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
  <link rel="stylesheet" th:href="@{/css/receipt.css}">
</head>
<body class="receipt-page">
  <main class="receipt-shell">
    <header class="receipt-head">
      <a class="back-link" th:href="@{/expenses}">← 家計簿に戻る</a>
      <span class="brand">Vita / レシート家計簿</span>
      <h1>レシートを読み取る</h1>
      <p class="lead">レシートを撮影するか画像を選ぶと、合計金額・品目・日付を自動で読み取ります。</p>
    </header>

    <div class="error" th:if="${error}" th:text="${error}"></div>
    <div class="error" th:if="${receiptError}" th:text="${receiptError}"></div>
    <div class="message" th:if="${message}" th:text="${message}"></div>

    <section class="scan-card">
      <form id="scan-form">
        <label class="dropzone" id="dropzone" for="file">
          <input id="file" name="file" type="file" accept="image/jpeg,image/png" capture="environment" hidden>
          <span class="dropzone-icon" aria-hidden="true">📷</span>
          <span class="dropzone-title">レシートを撮影する / 画像を選択</span>
          <span class="dropzone-hint">JPEG・PNG（10MBまで）</span>
          <img id="preview" class="preview" alt="選択したレシート画像" hidden>
        </label>
        <button id="scan-btn" class="btn btn-primary" type="submit" disabled>読み取る</button>
      </form>

      <div id="loading" class="loading" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <p>レシートを読み取っています…</p>
        <p class="hint">金額・品目・日付を抽出中（数秒かかります）</p>
      </div>

      <div id="scan-error" class="error" hidden>
        <span id="scan-error-text"></span>
        <span id="scan-error-detail" class="error-detail" hidden></span>
      </div>
    </section>

    <section id="result" class="result-card" hidden>
      <p class="result-label">読み取った合計金額</p>
      <p class="result-amount" id="result-amount">¥0</p>
      <p class="result-sub" id="result-sub"></p>

      <form th:action="@{/receipts/save}" method="post" id="save-form">
        <div class="field">
          <label for="itemName">品目名</label>
          <input id="itemName" name="itemName" type="text" maxlength="50" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="amountJpy">金額（円）</label>
            <input id="amountJpy" name="amountJpy" type="number" step="0.01" min="0.01" required>
          </div>
          <div class="field">
            <label for="expenseDate">支出日</label>
            <input id="expenseDate" name="expenseDate" type="date" required>
          </div>
        </div>

        <div class="field">
          <label for="category">カテゴリ</label>
          <select id="category" name="category">
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
          </select>
        </div>

        <input type="hidden" id="currency" name="currency">
        <input type="hidden" id="originalAmount" name="originalAmount">

        <p class="hint">読み取り結果は保存前に手で修正できます。</p>
        <button class="btn btn-coral" type="submit">この内容で家計簿に登録</button>
        <button class="btn btn-ghost" type="button" id="rescan-btn">別のレシートを読み取る</button>
      </form>
    </section>
  </main>

  <script th:src="@{/js/receipt.js}"></script>
</body>
</html>
