spring.application.name=kakeibo
 
# DB接続（自分のPCのOracle XE）
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=vita_app_user
# パスワードは application-local.properties に書く（Gitには入れない）
spring.profiles.active=local
 
# 自分のPCで開発するときは update（Expense.java に合わせてテーブルを自動作成）
# 共有DBにつなぐときは validate に変える
spring.jpa.hibernate.ddl-auto=validate

# ============================================================
# レシート読み取り（Gemini API）
# APIキーは application-local.properties に書く（Gitには入れない）
# 例: gemini.api.key=AIza...
# 環境変数 GEMINI_API_KEY でも指定できる
# ============================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash

# スマートフォンの写真は1MBを超えることが多いので上限を上げる
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB