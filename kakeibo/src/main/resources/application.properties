spring.application.name=kakeibo
 
# DB接続（自分のPCのOracle XE）
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=vita_app_user
# パスワードは application-local.properties に書く（Gitには入れない）
spring.profiles.active=local
 
# 自分のPCで開発するときは update（Expense.java に合わせてテーブルを自動作成）
# 共有DBにつなぐときは validate に変える
spring.jpa.hibernate.ddl-auto=validate