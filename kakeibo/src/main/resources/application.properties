spring.application.name=kakeibo
 
# DB接続（自分のPCのOracle XE）
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=vita_app_user
# パスワードは application-local.properties に書く（Gitには入れない）
spring.profiles.default=local
 
# 自分のPCで開発するときは update（Expense.java に合わせてテーブルを自動作成）
# 共有DBにつなぐときは validate に変える
spring.jpa.hibernate.ddl-auto=validate

# スマートフォンの写真は1MBを超えることが多いので上限を上げる
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
# 上限を超えた画像でも接続を切らずに、画面へ理由を返せるようにする
server.tomcat.max-swallow-size=25MB

# スマートフォンやVS Codeのポート転送（Dev Tunnels）経由でも、
# リダイレクト先が http://127.0.0.1:8080/... にならないようにする
server.tomcat.use-relative-redirects=true
# リバースプロキシが付ける X-Forwarded-* を尊重する
server.forward-headers-strategy=framework

# メモ: 画面表示の途中で追加のDB問い合わせをしない設定です。
spring.jpa.open-in-view=false

# Amazon Textract設定
aws.region=${AWS_REGION:ap-northeast-1}
