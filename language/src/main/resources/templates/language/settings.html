<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:attr="lang=${currentLanguage}">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${loggedIn} ? #{language.title} + ' | Vita' : #{language.select_title} + ' | Vita'">言語設定 | Vita</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <header th:replace="~{fragments/common :: header(${loggedIn} ? #{language.title} : #{language.select_title})}"></header>
  <main class="page-content">
    <!-- メモ: ログイン前は端末言語をおすすめとして選択し、適用後はセッション設定に保存します。 -->
    <h1 th:text="${loggedIn} ? #{language.title} : #{language.select_title}">言語設定</h1>
    <p class="notice" th:text="#{language.description}">表示に使う言語を選んで「適用」を押してください。</p>
    <form class="form-panel language-form" th:action="@{/language}" method="post">
      <fieldset class="language-options">
        <legend th:text="#{language.legend}">表示言語</legend>
        <label th:each="option : ${languages}">
          <span th:text="${option.flag}" aria-hidden="true">🇯🇵</span>
          <span th:text="${option.label}">日本語</span>
          <small th:if="${selectedLanguage == null && recommendedLanguage == option.code}"
                 th:text="#{language.recommended}">端末のおすすめ</small>
          <input type="radio" name="language" th:value="${option.code}"
                 th:checked="${selectedLanguage == option.code || (selectedLanguage == null && recommendedLanguage == option.code)}"
                 required>
        </label>
      </fieldset>
      <button class="primary-action" type="submit" th:text="#{language.apply}">適用</button>
      <a class="secondary-action" th:if="${loggedIn}" th:href="@{/home}"
         th:text="#{language.back_home}">ホームへ戻る</a>
    </form>
  </main>
  <footer th:replace="~{fragments/common :: footer}"></footer>
  <nav th:if="${loggedIn}" th:replace="~{fragments/common :: nav('settings')}"></nav>
</div>
</body>
</html>
