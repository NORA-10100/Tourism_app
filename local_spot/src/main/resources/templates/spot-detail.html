<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="|${spot.name} | Vita">スポット詳細 | Vita</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell"><header th:replace="~{fragments/common :: header('スポット詳細')}"></header>
  <main class="page-content"><a class="back-text" th:href="@{/features/spots}">‹ おすすめ一覧</a>
    <div class="spot-photo detail-photo" th:classappend="| spot-photo-${spot.visualStyle}|"><span th:text="${spot.feature}">沖縄のおすすめ</span></div>
    <div class="spot-card-labels"><span class="spot-tag" th:text="${spot.area}">エリア</span><span class="spot-tag" th:text="${spot.category}">カテゴリ</span></div>
    <h1 th:text="${spot.name}">スポット名</h1><p class="detail-description" th:text="${spot.description}">説明</p>
    <div class="detail-info"><span>営業時間</span><strong th:text="${spot.businessHours}">営業時間</strong><span>アクセス</span><strong th:text="${spot.access}">アクセス</strong><span>口コミ評価</span><strong th:text="|★ ${spot.rating} / 5.0（${spot.reviewCount}件）|">評価</strong><span>静かさの目安</span><strong th:text="|${100 - spot.crowdScore}%（サンプル）|">目安</strong></div>
    <p class="sample-note">スポット情報と静かさの目安はサンプルです。営業時間・交通情報は訪問前に最新情報をご確認ください。</p>
    <a class="primary-action" th:href="@{/features/spots(area=${spot.area},category=${spot.category})}">このエリアのおすすめを見る</a>
  </main><nav th:replace="~{fragments/common :: nav('spots')}"></nav>
</div></body></html>
