<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja" th:attr="lang=${currentLanguage}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="scan-url" th:content="@{/api/receipts/scan}">
  <meta name="csrf-token" th:content="${_csrf != null ? _csrf.token : ''}">
  <meta name="csrf-header" th:content="${_csrf != null ? _csrf.headerName : ''}">
  <meta name="theme-color" content="#ffffff">
  <title>レシート読み取り | Vita</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/receipt.css}">
</head>
<body>
  <div class="app-shell">
    <header th:replace="~{fragments/common :: header(#{nav.expenses})}"></header>
    <main class="page-content receipt-page">
      <a class="back-text" th:href="@{/expenses}">家計簿に戻る</a>
      <h1>レシートを読み取る</h1>
      <p class="notice">レシートを撮影するか画像を選ぶと、合計金額・品目・日付を自動で読み取ります。</p>

      <p class="error" th:if="${error}" th:text="${error}"></p>
      <p class="error" th:if="${receiptError}" th:text="${receiptError}"></p>
      <p class="notice success" th:if="${message}" th:text="${message}"></p>

      <section class="form-panel scan-card">
      <form id="scan-form">
        <div class="scan-actions">
          <button id="camera-btn" class="secondary-action" type="button">カメラで撮影</button>
          <button id="gallery-btn" class="secondary-action" type="button">画像を選択</button>
        </div>
        <input id="file" name="file" type="file" accept="image/*" hidden>
        <input id="camera-file" type="file" accept="image/*" capture="environment" hidden>
        <label class="dropzone" id="dropzone" for="file">
          <span class="dropzone-icon" aria-hidden="true">📷</span>
          <span class="dropzone-title">ここに画像をドロップ / タップして選択</span>
          <span class="dropzone-hint">JPEG・PNG（20MBまで。送信前に自動で縮小します）</span>
          <img id="preview" class="preview" alt="選択したレシート画像" hidden>
        </label>
        <button id="scan-btn" class="primary-action scan-submit" type="submit" disabled>読み取る</button>
        <p class="hint manual-link">読み取れない場合は <a th:href="@{/expenses/new}">手入力で登録</a> できます。</p>
      </form>

      <div id="loading" class="loading" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <p id="loading-text">レシートを読み取っています…</p>
        <p class="hint">金額・品目・日付を抽出中（数秒かかります）</p>
      </div>

      <div id="scan-error" class="error" hidden>
        <span id="scan-error-text"></span>
        <span id="scan-error-detail" class="error-detail" hidden></span>
      </div>
      </section>

      <section id="result" class="form-panel result-card" hidden>
        <p class="result-label">読み取った合計金額</p>
        <p class="result-amount" id="result-amount">¥0</p>
        <p class="result-sub" id="result-sub"></p>

        <form th:action="@{/receipts/save}" method="post" id="save-form">
        <label class="form-field" for="itemName">品目名
          <input id="itemName" name="itemName" type="text" maxlength="50" required>
        </label>

        <div class="field-row">
          <label class="form-field" for="amountJpy">金額（円）
            <input id="amountJpy" name="amountJpy" type="number" step="0.01" min="0.01" required>
          </label>
          <label class="form-field" for="expenseDate">支出日
            <input id="expenseDate" name="expenseDate" type="date" required>
          </label>
        </div>

        <label class="form-field" for="category">カテゴリ
          <select id="category" name="category" required>
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
          </select>
        </label>

        <input type="hidden" id="currency" name="currency">
        <input type="hidden" id="originalAmount" name="originalAmount">

        <p class="hint">読み取り結果は保存前に手で修正できます。</p>
        <button class="primary-action" type="submit">この内容で家計簿に登録</button>
        <button class="secondary-action" type="button" id="rescan-btn">別のレシートを読み取る</button>
        </form>
      </section>
    </main>
    <footer th:replace="~{fragments/common :: footer}"></footer>
    <nav th:replace="~{fragments/common :: nav('expenses')}"></nav>
  </div>

  <script th:src="@{/js/receipt.js}"></script>
</body>
</html>
