<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:attr="lang=${currentLanguage}">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{spot.title} + ' | Vita'">スポットを探す | Vita</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <header th:replace="~{fragments/common :: header(#{spot.title})}"></header>
  <main class="page-content">
    <!-- メモ: 検索条件はGETで送信し、結果URLを再表示・共有できるようにします。 -->
    <h1 th:text="#{spot.condition.heading}">条件を入力</h1>
    <p class="notice" th:text="#{spot.condition.description}">エリアとカテゴリを選ぶとおすすめスポットを表示します。</p>
    <form class="form-panel" th:action="@{/spots/results}" method="get">
      <label class="form-field">
        <span th:text="#{spot.area.label}">滞在エリア</span>
        <select name="area">
          <option value="" th:text="#{spot.area.all}">すべてのエリア</option>
          <option th:each="area : ${areas}" th:value="${area}" th:text="${area}"
                  th:selected="${selectedArea == area}">那覇市</option>
        </select>
      </label>
      <label class="form-field">
        <span th:text="#{spot.category.label}">カテゴリ</span>
        <select name="category">
          <option th:each="category : ${categories}" th:value="${category.value}"
                  th:text="${category.label}" th:selected="${selectedCategory == category.value}">すべて</option>
        </select>
      </label>
      <button class="primary-action" type="submit" th:text="#{spot.search}">この条件で検索する</button>
    </form>
  </main>
  <footer th:replace="~{fragments/common :: footer}"></footer>
  <nav th:replace="~{fragments/common :: nav('spots')}"></nav>
</div>
</body>
</html>
