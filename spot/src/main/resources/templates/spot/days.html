<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:attr="lang=${currentLanguage}">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{spot.days.title} + ' | Vita'">日数を選択 | Vita</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <header th:replace="~{fragments/common :: header(#{spot.days.title})}"></header>
  <main class="page-content">
    <!-- メモ: セッションに選択スポットがある場合だけ、日数と一緒にプラン作成を依頼します。 -->
    <a class="back-text" th:href="@{/spots}" th:text="#{common.back_spots}">‹ スポット</a>
    <h1 th:text="#{spot.days.title}">日数を選択</h1>
    <p class="notice" th:text="#{spot.days.description}">選択したスポットと日数から旅行プランを作成します。</p>
    <h2 class="section-title" th:text="#{spot.days.selected}">選択したスポット</h2>
    <p class="empty-state" th:if="${#lists.isEmpty(spots)}" th:text="#{spot.days.empty}">スポットが選択されていません。</p>
    <ul th:unless="${#lists.isEmpty(spots)}">
      <li th:each="spot : ${spots}" th:text="${spot.name}">首里城公園</li>
    </ul>
    <p class="field-error" role="alert" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/spots/plan}" method="post">
      <label class="form-field">
        <span th:text="#{spot.days.title}">日数を選択</span>
        <select name="days" required>
          <option value="" selected disabled th:text="#{spot.days.required}">日数を選択してください</option>
          <option th:each="option : ${dayOptions}" th:value="${option.value}" th:text="${option.label}">1日</option>
        </select>
      </label>
      <button class="primary-action" type="submit" th:text="#{spot.days.generate}">旅行プランを作成</button>
    </form>
  </main>
  <footer th:replace="~{fragments/common :: footer}"></footer>
  <nav th:replace="~{fragments/common :: nav('spots')}"></nav>
</div>
</body>
</html>
