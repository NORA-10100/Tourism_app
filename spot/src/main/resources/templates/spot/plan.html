<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:attr="lang=${currentLanguage}">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{spot.plan.title} + ' | Vita'">旅行プラン | Vita</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <header th:replace="~{fragments/common :: header(#{spot.plan.title})}"></header>
  <main class="page-content">
    <!-- メモ: 保存済みプランの日別順序・時刻・滞在時間を表示します。 -->
    <h1 th:text="#{spot.plan.summary(${plan.days})}">旅行プラン</h1>
    <section class="expense-card" th:each="day : ${plan.dayList}">
      <h2 th:text="#{spot.plan.day(${day.dayNumber})}">1日目</h2>
      <ol>
        <li th:each="entry : ${day.entries}">
          <strong th:text="${entry.time}">09:00</strong>
          <a th:href="@{/spots/{id}(id=${entry.spot.id})}" th:text="${entry.spot.name}">首里城公園</a>
          <span th:text="#{spot.plan.stay(${entry.stayMinutes})}">滞在 約90分</span>
          <p th:if="${!#strings.isEmpty(entry.travelNote)}" th:text="${entry.travelNote}">車で移動</p>
        </li>
      </ol>
    </section>
    <p class="notice" th:text="#{spot.plan.notice}">移動時間は目安です。</p>
    <a class="secondary-action" th:href="@{/expenses}" th:text="#{spot.plan.budget}">予算・持ち物リスト（家計簿）</a>
    <a class="secondary-action" th:href="@{/currency}" th:text="#{spot.plan.currency}">為替レートを見る</a>
    <a class="primary-action" th:href="@{/spots}" th:text="#{spot.plan.again}">条件入力に戻る</a>
  </main>
  <footer th:replace="~{fragments/common :: footer}"></footer>
  <nav th:replace="~{fragments/common :: nav('spots')}"></nav>
</div>
</body>
</html>
